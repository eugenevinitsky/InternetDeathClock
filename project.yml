name: InternetDeathClock
options:
  bundleIdPrefix: com.eugenevinitsky
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: J894HJ46U8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  InternetDeathClock:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.internetdeathclock
        INFOPLIST_FILE: Mac/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Mac/Mac.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.eugenevinitsky.internetdeathclock

  DeathClockPhone:
    type: application
    platform: iOS
    sources: [iOS/App, iOS/Common, iOS/Assets.xcassets, Shared]
    dependencies:
      - target: DeathClockReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.internetdeathclock.phone
        PRODUCT_NAME: Death Clock
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Death Clock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.eugenevinitsky.internetdeathclock]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.eugenevinitsky.internetdeathclock

  DeathClockReport:
    type: app-extension
    platform: iOS
    sources: [iOS/Report, iOS/Common, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenevinitsky.internetdeathclock.phone.report
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/Report/Info.plist
      properties:
        CFBundleDisplayName: Death Clock Report
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: iOS/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.eugenevinitsky.internetdeathclock]
